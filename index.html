<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Word List Study</title>
  <style>
    :root{
      --bg:#f6f7f9;--panel:#fff;--text:#1f2328;--muted:#6b7280;
      --border:#d9dde3;--accent:#2563eb;--cover:#dfe3e8;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .app{max-width:820px;margin:0 auto;padding:12px}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    button,label.file-btn,input,select{font:inherit;color:var(--text)}
    button,.file-btn,select{min-height:38px;border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 11px;cursor:pointer;color:var(--text);-webkit-text-fill-color:var(--text)}
    button.primary{background:var(--accent);color:#fff;-webkit-text-fill-color:#fff;border-color:var(--accent)}
    button:disabled{opacity:.5;cursor:default}
    .file-btn input{display:none}
    .filters button.active,.sorts button.active{border-color:var(--accent);color:var(--accent);-webkit-text-fill-color:var(--accent)}
    .count{margin-left:auto;color:var(--muted);font-size:.9rem}
    .hint{font-size:.84rem;color:var(--muted);line-height:1.45;margin-top:6px}
    .status{font-size:.9rem;margin-top:6px}.status.good{color:#18794e}.status.bad{color:#b42318}
    .filter-option{display:flex;align-items:center;gap:6px;min-height:38px;padding:0 2px}
    .filter-option input{width:18px;height:18px;accent-color:var(--accent)}
    .filter-option select{min-height:34px;padding:5px 8px}
    .tabs{display:flex;gap:6px;overflow-x:auto;white-space:nowrap;padding:2px 0 8px;scrollbar-width:thin}
    .tabs button{flex:0 0 auto;min-height:34px;padding:6px 10px}
    .tabs button.active{border-color:var(--accent);color:var(--accent);-webkit-text-fill-color:var(--accent);font-weight:600}
    .list-wrap{position:relative}.words{display:flex;flex-direction:column;gap:8px}
    .word-row{display:grid;grid-template-columns:minmax(120px,1fr) 48px minmax(140px,1fr);gap:8px;align-items:stretch;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px}
    .word-cell{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:2px 4px}
    .word-main{font-weight:650;word-break:break-word}
    .word-index{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
    .word-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
    .recent{letter-spacing:.08em;white-space:nowrap}
    .streak{white-space:nowrap}
    .check-cell{display:flex;align-items:center;justify-content:center}.check-cell input{width:23px;height:23px;accent-color:var(--accent)}
    .meaning-cell{position:relative;min-height:48px;overflow:hidden;border-radius:8px;background:#fafafa;border:1px solid var(--border)}
    .meaning-text{position:absolute;inset:0;display:flex;align-items:center;padding:8px 10px;word-break:break-word}
    .empty-state{padding:18px;text-align:center;color:var(--muted)}
    [hidden]{display:none!important}
    dialog.modal{width:min(760px,calc(100vw - 24px));max-height:min(90dvh,900px);margin:auto;padding:0;border:0;border-radius:14px;background:transparent;color:var(--text);overflow:auto}
    dialog.modal::backdrop{background:rgba(15,23,42,.52)}
    dialog.modal>.panel{margin:0;border-radius:14px;overflow-wrap:anywhere}
    dialog.modal input[type="text"]{max-width:100%;min-width:0;overflow-wrap:anywhere}
    .meaning-curtain{position:absolute;z-index:20;background:var(--cover);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);user-select:none;pointer-events:none}.meaning-curtain.hidden{display:none}
    .curtain-handle{position:absolute;z-index:21;height:34px;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;cursor:ns-resize;touch-action:none;user-select:none}.curtain-handle.hidden{display:none}
    .curtain-handle::before{content:"";width:58px;height:5px;border-radius:999px;background:#7d848d;box-shadow:0 0 0 6px rgba(223,227,232,.95)}
    textarea{width:100%;min-height:120px;border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;resize:vertical}#sessionUrl{width:100%;margin-top:8px}
    @media(max-width:560px){
      .app{padding:8px}
      .word-row{grid-template-columns:minmax(96px,1fr) 42px minmax(110px,1fr);gap:6px;padding:6px}
      .word-main{font-size:.98rem}.word-meta{font-size:.7rem;gap:7px}.meaning-text{padding:7px 8px}
    }
  </style>
</head>
<body>
<div class="app">
  <div class="panel">
    <div class="row">
      <button id="openSettings">設定</button>
      <button id="openGpt">GPT学習</button>
      <button id="resetCurtain">最初に戻す</button>
      <button id="repeatStudy" disabled>もう一度学習</button>
      <span id="count" class="count">0語</span>
    </div>
    <div class="hint">CSV形式: <code>id,word,meaning</code>。同じidなら再読込しても学習履歴を引き継ぎます。</div>
  </div>

  <dialog id="settingsPanel" class="modal" aria-labelledby="settingsTitle">
  <div class="panel">
    <div class="row"><strong id="settingsTitle">設定</strong><button id="closeSettings">閉じる</button></div>
    <div class="row" style="margin-top:8px">
      <label>タブあたり
        <select id="pageSize" aria-label="タブあたりの表示語数">
          <option value="10">10語</option><option value="20">20語</option><option value="50">50語</option><option value="100">100語</option>
        </select>
      </label>
      <label>習得済み判定
        <select id="masteryThreshold" aria-label="習得済み判定の連続正答回数">
          <option value="2">2回</option><option value="3">3回</option><option value="4">4回</option><option value="5">5回</option>
        </select>
      </label>
      <label class="file-btn">CSV読込・差し替え<input id="csvFile" type="file" accept=".csv,text/csv"></label>
      <button id="resetSettings">設定を初期値に戻す</button>
      <button id="clearData">データ消去</button>
    </div>
    <div class="hint">設定の初期化では学習履歴は消去されません。</div>
  </div>
  </dialog>

  <div class="panel filters">
    <div class="row">
      <button data-filter="all" class="active">すべて</button>
      <button data-filter="hasMiss">非正答あり</button>
      <label class="filter-option">
        <input id="excludeStreak" type="checkbox">
        習得済みを除外 <span id="masteryRule"></span>
      </label>
    </div>
  </div>

  <div class="panel sorts">
    <div class="row">
      <button id="normalOrder" class="active">通常順</button>
      <button id="randomOrder">ランダム</button>
      <button id="reshuffle">再シャッフル</button>
    </div>
    <div class="hint">ランダム順は再シャッフルするまで端末内に保持します。</div>
  </div>

  <div class="panel">
    <div id="tabs" class="tabs"></div>
    <div id="tabHint" class="hint">表示条件を適用してタブに分割します。</div>
  </div>

  <div id="listWrap" class="list-wrap">
    <div id="words" class="words"></div>
    <div id="emptyState" class="empty-state" hidden>表示対象の単語がありません。</div>
    <div id="meaningCurtain" class="meaning-curtain hidden"></div>
    <div id="curtainHandle" class="curtain-handle hidden" aria-label="意味カバーを上下に動かす"></div>
  </div>

  <dialog id="gptPanel" class="modal" aria-labelledby="gptTitle">
    <div class="panel">
      <div class="row"><strong id="gptTitle">GPT学習</strong><button id="closeGpt">閉じる</button></div>
      <div class="row" style="margin-top:8px">
        <button id="makeSession" class="primary">このタブをGPT用URLにする</button>
        <button id="copySession" disabled>URLをコピー</button>
      </div>
      <input id="sessionUrl" type="text" readonly placeholder="ここにGPT用URLが出ます">
      <div class="hint">現在表示中の最大<span id="gptPageSize">50</span>語をGPT学習対象にします。</div>
      <div class="row" style="margin-top:12px"><strong>GPT学習結果を反映</strong><button id="applyResults">結果JSONを登録</button></div>
      <textarea id="resultJson" aria-label="GPT学習結果JSON" placeholder='{"version":1,"sessionId":"...","results":[{"id":"1","result":"correct"}]}'></textarea>
      <div id="resultStatus" class="status" role="status" aria-live="polite"></div>
    </div>
  </dialog>
</div>

<script src="study-core.js"></script>
<script>
(() => {
  const SESSION_TTL_MS=5*60*1000, MAX_RECENT=StudyCore.MAX_RECENT;
  const STORAGE_WORDS="wordlist.words.v2";
  const STORAGE_STATE="wordlist.state.v2";
  const STORAGE_GPT_SESSIONS="wordlist.gptSessions.v2";
  const STORAGE_ACTIVE_SESSION="wordlist.activeStudySession.v2";
  const STORAGE_RANDOM_ORDER="wordlist.randomOrder.v1";
  const STORAGE_VIEW="wordlist.view.v1";
  const STORAGE_PREFERENCES="wordlist.preferences.v1";
  const STORAGE_LEDGER="wordlist.studyLedger.v1";
  const savedCore=StudyCore.loadCore(localStorage,STORAGE_LEDGER,{stateKey:STORAGE_STATE,gptSessionsKey:STORAGE_GPT_SESSIONS,activeSessionKey:STORAGE_ACTIVE_SESSION});

  let words=loadJson(STORAGE_WORDS,[]);
  let state=savedCore.state;
  let gptSessions=savedCore.gptSessions;
  let registeredGptSessionIds=savedCore.registeredGptSessionIds||[];
  let randomIds=loadJson(STORAGE_RANDOM_ORDER,[]);
  const savedView=loadJson(STORAGE_VIEW,{});
  const savedPreferences=loadJson(STORAGE_PREFERENCES,{});
  const PAGE_SIZES=[10,20,50,100], MASTERY_THRESHOLDS=[2,3,4,5];
  const initialPreferences=StudyCore.normalizePreferences(savedPreferences,savedView);
  let pageSize=initialPreferences.pageSize;

  let filter=savedView.filter==="hasMiss"?"hasMiss":"all";
  let sortMode=savedView.sortMode==="random"?"random":"normal";
  let excludeStreak=!!savedView.excludeStreak;
  let masteryThreshold=initialPreferences.masteryThreshold;
  let pageIndex=Math.max(0,Math.floor(Number(savedView.pageIndex)||0));
  let revealY=0, lastSessionUrl="", activeSession=savedCore.activeSession;

  const els={
    openSettings:document.getElementById("openSettings"),closeSettings:document.getElementById("closeSettings"),settingsPanel:document.getElementById("settingsPanel"),openGpt:document.getElementById("openGpt"),closeGpt:document.getElementById("closeGpt"),gptPanel:document.getElementById("gptPanel"),repeatStudy:document.getElementById("repeatStudy"),
    csvFile:document.getElementById("csvFile"),resetCurtain:document.getElementById("resetCurtain"),clearData:document.getElementById("clearData"),
    pageSize:document.getElementById("pageSize"),masteryThreshold:document.getElementById("masteryThreshold"),resetSettings:document.getElementById("resetSettings"),
    count:document.getElementById("count"),tabs:document.getElementById("tabs"),listWrap:document.getElementById("listWrap"),words:document.getElementById("words"),
    emptyState:document.getElementById("emptyState"),masteryRule:document.getElementById("masteryRule"),tabHint:document.getElementById("tabHint"),gptPageSize:document.getElementById("gptPageSize"),
    meaningCurtain:document.getElementById("meaningCurtain"),curtainHandle:document.getElementById("curtainHandle"),
    excludeStreak:document.getElementById("excludeStreak"),
    normalOrder:document.getElementById("normalOrder"),randomOrder:document.getElementById("randomOrder"),reshuffle:document.getElementById("reshuffle"),
    makeSession:document.getElementById("makeSession"),copySession:document.getElementById("copySession"),sessionUrl:document.getElementById("sessionUrl"),
    resultJson:document.getElementById("resultJson"),applyResults:document.getElementById("applyResults"),resultStatus:document.getElementById("resultStatus")
  };

  function loadJson(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
  function persistCore(){
    localStorage.setItem(STORAGE_WORDS,JSON.stringify(words));
    writeCoreSnapshot();
  }
  function writeCoreSnapshot(){StudyCore.saveCore(localStorage,STORAGE_LEDGER,{state,activeSession,gptSessions,registeredGptSessionIds})}
  function persistView(){
    localStorage.setItem(STORAGE_VIEW,JSON.stringify({filter,sortMode,excludeStreak,excludeStreakN:masteryThreshold,pageIndex}));
  }
  function persistPreferences(){localStorage.setItem(STORAGE_PREFERENCES,JSON.stringify({pageSize,masteryThreshold}))}
  if(savedCore.gptSessionMigrationNeeded){try{writeCoreSnapshot()}catch{}}

  const defaultState=StudyCore.defaultState, normalizeState=StudyCore.normalizeState, appendResult=StudyCore.appendResult;
  function getState(id){if(!state[id])state[id]=defaultState();state[id]=normalizeState(state[id]);return state[id]}
  function recentThree(st){
    const arr=(st.recentResults||[]).slice(-3).map(v=>v?"○":"×");
    while(arr.length<3)arr.unshift("·");
    return arr.join(" ");
  }

  function sameIdSet(orderIds,currentIds){
    if(!Array.isArray(orderIds)||orderIds.length!==currentIds.length)return false;
    const s=new Set(currentIds);
    return orderIds.every(id=>s.has(String(id)))&&new Set(orderIds.map(String)).size===currentIds.length;
  }
  function validateRandomOrder(){
    const ids=words.map(w=>String(w.id));
    if(!sameIdSet(randomIds,ids)){
      randomIds=[];
      localStorage.removeItem(STORAGE_RANDOM_ORDER);
      if(sortMode==="random")sortMode="normal";
    }
  }
  function shuffledIds(){
    const a=words.map(w=>String(w.id));
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
    return a;
  }
  function ensureRandomOrder(){
    validateRandomOrder();
    if(!randomIds.length&&words.length){randomIds=shuffledIds();localStorage.setItem(STORAGE_RANDOM_ORDER,JSON.stringify(randomIds))}
  }

  function importCsv(text){
    finalizeSession();
    const oldIds=words.map(w=>String(w.id));
    const next=StudyCore.parseWordCsv(text);
    words=next;for(const w of words)getState(w.id);
    const newIds=words.map(w=>String(w.id));
    if(!sameIdSet(oldIds,newIds)){
      randomIds=[];localStorage.removeItem(STORAGE_RANDOM_ORDER);sortMode="normal";
    }
    filter="all";excludeStreak=false;pageIndex=0;revealY=0;activeSession=null;
    localStorage.removeItem(STORAGE_ACTIVE_SESSION);
    persistCore();persistView();startSession(true);render();
  }

  function pageModel(){return StudyCore.buildPageModel(words,state,{pageSize,sortMode,randomIds,filter,excludeStreak,masteryThreshold})}
  function pageWords(){const model=pageModel(),index=StudyCore.safePageIndex(model.pages,pageIndex);return model.pages[index]?.entries||[]}

  function sessionKey(){return `${filter}:${excludeStreak?masteryThreshold:"off"}:${sortMode}:${pageSize}:${pageIndex}`}
  function saveActiveSession(touch=false){
    if(!activeSession)return;
    if(touch)activeSession.updatedAt=Date.now();activeSession.revealY=revealY;
    writeCoreSnapshot();
  }
  function finalizeStoredSession(stored){
    if(!stored)return;
    const session={studiedIds:Array.isArray(stored.studiedIds)?stored.studiedIds:[],checkedIds:Array.isArray(stored.checkedIds)?stored.checkedIds:[],finalizedIds:Array.isArray(stored.finalizedIds)?stored.finalizedIds:[]};
    StudyCore.finalizeStudySession(session,getState);activeSession=null;
    persistCore();
  }
  function tryRestoreSession(){
    const stored=activeSession||loadJson(STORAGE_ACTIVE_SESSION,null);
    if(!stored)return false;
    const legacyThreshold=Math.min(10,Math.max(2,Number(savedView.excludeStreakN||3)));
    const legacyKey=`${filter}:${excludeStreak?legacyThreshold:"off"}:${sortMode}:${pageIndex}`;
    const model=pageModel(),visibleIndex=StudyCore.safePageIndex(model.pages,pageIndex);
    const currentPageIds=model.pages[visibleIndex]?.entries.map(word=>String(word.id))||[];
    const restored=StudyCore.tryRestoreSession(stored,{
      now:Date.now(),ttl:SESSION_TTL_MS,currentKey:sessionKey(),legacyKey,filter,sortMode,pageIndex,
      excludeStreak,masteryThreshold,legacyThreshold,words,state,randomIds,currentPageIds
    });
    if(!restored){
      finalizeStoredSession(stored);localStorage.removeItem(STORAGE_ACTIVE_SESSION);activeSession=null;
      return false;
    }
    activeSession={
      sessionId:restored.sessionId||`${Date.now()}-${Math.random().toString(36).slice(2,8)}`,
      key:sessionKey(),updatedAt:restored.updatedAt,revealY:Number(restored.revealY||0),
      studiedIds:Array.isArray(restored.studiedIds)?restored.studiedIds:[],
      checkedIds:Array.isArray(restored.checkedIds)?restored.checkedIds:[],
      finalizedIds:Array.isArray(restored.finalizedIds)?restored.finalizedIds:[],
      pendingId:restored.pendingId||null
    };
    revealY=activeSession.revealY;return true;
  }
  function startSession(forceNew=false){
    if(!forceNew&&tryRestoreSession())return;
    const model=pageModel(),safeIndex=StudyCore.safePageIndex(model.pages,pageIndex);
    if(safeIndex!==pageIndex){pageIndex=safeIndex;persistView()}
    activeSession={sessionId:`${Date.now()}-${Math.random().toString(36).slice(2,8)}`,key:sessionKey(),updatedAt:Date.now(),revealY:0,studiedIds:[],checkedIds:[],finalizedIds:[],pendingId:null};
    revealY=0;saveActiveSession();
  }
  function finalizeSessionResults(){
    if(!activeSession)return;
    StudyCore.finalizeStudySession(activeSession,getState);activeSession.pendingId=null;
  }
  function finalizeSession(){
    if(!activeSession)return;
    finalizeSessionResults();activeSession=null;persistCore();localStorage.removeItem(STORAGE_ACTIVE_SESSION);
  }

  function markStudied(id){
    if(!activeSession)startSession();
    const st=getState(id);if(!StudyCore.recordStudy(activeSession,id,st))return;activeSession.pendingId=id;
    activeSession.updatedAt=Date.now();persistCore();renderCheckboxFor(id);
  }
  function markAnswer(id,checked){
    if(!activeSession)return;
    const changed=StudyCore.setSessionAnswer(activeSession,id,checked);
    if(!changed){const row=els.words.querySelector(`.word-row[data-id="${CSS.escape(String(id))}"]`);const cb=row?.querySelector('.check-cell input');if(cb)cb.checked=activeSession.checkedIds.includes(id);return}
    saveActiveSession(true);
  }

  function renderCheckboxFor(id){const row=els.words.querySelector(`.word-row[data-id="${CSS.escape(String(id))}"]`);if(!row)return;const cb=row.querySelector('.check-cell input');if(cb){cb.disabled=false}}
  function refreshVisibleRows(){
    const scrollX=window.scrollX,scrollY=window.scrollY;
    for(const row of els.words.querySelectorAll('.word-row')){
      const id=row.dataset.id,st=getState(id),cb=row.querySelector('.check-cell input');
      row.querySelector('.recent').textContent=`直近 ${recentThree(st)}`;
      row.querySelector('.streak').textContent=`連続 ${st.currentStreak||0}`;
      if(cb){cb.checked=!!activeSession?.checkedIds?.includes(id);cb.disabled=!activeSession?.studiedIds?.includes(id)||!!activeSession?.finalizedIds?.includes(id)}
    }
    window.scrollTo(scrollX,scrollY);
  }

  function renderTabs(model){
    els.tabs.replaceChildren();
    if(!model.pages.length){const b=document.createElement("button");b.textContent="0語";b.disabled=true;els.tabs.appendChild(b);return}
    for(const page of model.pages){
      const i=page.index,b=document.createElement("button");b.textContent=`${page.start}–${page.end}（残り${page.entries.length}語）`;b.disabled=page.entries.length===0;b.classList.toggle("active",i===pageIndex&&page.entries.length>0);
      b.addEventListener("click",()=>{
        if(i===pageIndex||b.disabled)return;
        finalizeSession();pageIndex=i;revealY=0;persistView();startSession(true);render();
      });
      els.tabs.appendChild(b);
    }
  }

  function renderRowsOnly(current=pageWords()){
    els.words.replaceChildren();els.emptyState.hidden=current.length>0;
    for(const w of current){
      const st=getState(w.id);
      const row=document.createElement("div");row.className="word-row";row.dataset.id=w.id;

      const wc=document.createElement("div");wc.className="word-cell";
      const number=document.createElement("div");number.className="word-index";number.textContent=String(w.displayNumber);
      const main=document.createElement("div");main.className="word-main";main.textContent=w.word;
      const meta=document.createElement("div");meta.className="word-meta";
      const recent=document.createElement("span");recent.className="recent";recent.textContent=`直近 ${recentThree(st)}`;
      const streak=document.createElement("span");streak.className="streak";streak.textContent=`連続 ${st.currentStreak||0}`;
      meta.append(recent,streak);wc.append(number,main,meta);

      const cc=document.createElement("div");cc.className="check-cell";
      const cb=document.createElement("input");cb.type="checkbox";
      cb.checked=!!activeSession?.checkedIds?.includes(w.id);
      const revealed=!!activeSession?.studiedIds?.includes(w.id);
      const finalized=!!activeSession?.finalizedIds?.includes(w.id);
      cb.disabled=!revealed||finalized;
      cb.setAttribute("aria-label",`${w.word} を今回正答として記録`);
      cb.addEventListener("change",()=>markAnswer(w.id,cb.checked));
      cc.appendChild(cb);

      const mc=document.createElement("div");mc.className="meaning-cell";mc.dataset.id=w.id;
      const mt=document.createElement("div");mt.className="meaning-text";mt.textContent=w.meaning;mc.appendChild(mt);
      row.append(wc,cc,mc);els.words.appendChild(row);
    }
    requestAnimationFrame(positionCurtain);
  }

  function render(){
    const model=pageModel(),safeIndex=StudyCore.safePageIndex(model.pages,pageIndex);
    if(safeIndex!==pageIndex){pageIndex=safeIndex;persistView()}
    const page=model.pages[pageIndex],current=page?.entries||[];
    renderTabs(model);renderRowsOnly(current);
    els.repeatStudy.disabled=current.length===0;
    els.count.textContent=page?`${page.start}–${page.end}範囲 / ${current.length}語（全${model.total}語）`:`0語`;
    document.querySelectorAll("[data-filter]").forEach(b=>b.classList.toggle("active",b.dataset.filter===filter));
    els.excludeStreak.checked=excludeStreak;els.masteryRule.textContent=`（連続正答 ${masteryThreshold}回以上）`;
    els.pageSize.value=String(pageSize);els.masteryThreshold.value=String(masteryThreshold);els.gptPageSize.textContent=String(pageSize);
    els.tabHint.textContent=sortMode==="normal"?`通常順: CSV登録順を${pageSize}語ずつ固定範囲に分けてからフィルタします。`:`ランダム順: フィルタ後に保存済み順序で${pageSize}語ずつ表示します。`;
    els.normalOrder.classList.toggle("active",sortMode==="normal");els.randomOrder.classList.toggle("active",sortMode==="random");
  }

  function geometry(){
    const cells=[...els.words.querySelectorAll(".meaning-cell")];if(!cells.length)return null;
    const wrapRect=els.listWrap.getBoundingClientRect(),firstRect=cells[0].getBoundingClientRect(),lastRect=cells[cells.length-1].getBoundingClientRect();
    const top=firstRect.top-wrapRect.top,left=firstRect.left-wrapRect.left,width=firstRect.width,bottom=lastRect.bottom-wrapRect.top;
    const thresholds=cells.map(cell=>{const r=cell.getBoundingClientRect();return{id:cell.dataset.id,bottom:r.bottom-wrapRect.top-top}});
    return{top,left,width,height:bottom-top,thresholds};
  }
  function processRevealProgress(){const g=geometry();if(!g||!activeSession)return;for(const t of g.thresholds)if(revealY>=t.bottom-1)markStudied(t.id)}
  function positionCurtain(){
    const g=geometry();
    if(!g){els.meaningCurtain.classList.add("hidden");els.curtainHandle.classList.add("hidden");return}
    revealY=Math.max(0,Math.min(revealY,g.height));
    els.meaningCurtain.classList.remove("hidden");els.curtainHandle.classList.remove("hidden");
    els.meaningCurtain.style.left=`${g.left}px`;els.meaningCurtain.style.width=`${g.width}px`;els.meaningCurtain.style.top=`${g.top+revealY}px`;els.meaningCurtain.style.height=`${Math.max(0,g.height-revealY)}px`;
    els.curtainHandle.style.left=`${g.left}px`;els.curtainHandle.style.width=`${g.width}px`;els.curtainHandle.style.top=`${g.top+revealY}px`;
    saveActiveSession();
  }
  function resetCurtain(){revealY=0;positionCurtain();saveActiveSession(true)}
  function repeatStudy(){
    const visibleIds=[...els.words.querySelectorAll(".word-row")].map(row=>row.dataset.id);
    const action=StudyCore.repeatStudyAction(activeSession,visibleIds);
    if(action==="empty")return;
    if(action==="confirm"&&!confirm("途中までの学習結果を確定して、もう一度学習しますか？"))return;
    finalizeSession();
    const model=pageModel();pageIndex=StudyCore.safePageIndex(model.pages,pageIndex);persistView();revealY=0;
    if(model.pages[pageIndex]?.entries.length)startSession(true);
    render();
  }

  function attachCurtainDrag(){
    let dragging=false,startClientY=0,startRevealY=0;
    els.curtainHandle.addEventListener("pointerdown",e=>{
      if(els.curtainHandle.classList.contains("hidden"))return;
      dragging=true;startClientY=e.clientY;startRevealY=revealY;els.curtainHandle.setPointerCapture(e.pointerId);e.preventDefault();
    });
    els.curtainHandle.addEventListener("pointermove",e=>{
      if(!dragging)return;const g=geometry();if(!g)return;
      revealY=Math.max(0,Math.min(startRevealY+(e.clientY-startClientY),g.height));positionCurtain();processRevealProgress();saveActiveSession(true);e.preventDefault();
    });
    const finish=e=>{
      if(!dragging)return;dragging=false;processRevealProgress();saveActiveSession(true);
      try{els.curtainHandle.releasePointerCapture(e.pointerId)}catch{}
    };
    els.curtainHandle.addEventListener("pointerup",finish);els.curtainHandle.addEventListener("pointercancel",finish);
  }

  function makeGptSession(){
    const current=pageWords();if(!current.length){alert("表示中の単語がありません。");return}
    const sessionId=`${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
    const payload=StudyCore.makeGptPayload(sessionId,current);
    const nextSessions={...gptSessions,[sessionId]:{createdAt:new Date().toISOString(),ids:current.map(w=>String(w.id))}};
    StudyCore.saveCore(localStorage,STORAGE_LEDGER,{state,activeSession,gptSessions:nextSessions,registeredGptSessionIds});
    gptSessions=nextSessions;
    const url=new URL(location.href);url.search="";url.hash="";
    url.searchParams.set("study",btoa(unescape(encodeURIComponent(JSON.stringify(payload)))));
    lastSessionUrl=url.toString();els.sessionUrl.value=lastSessionUrl;els.copySession.disabled=false;
  }
  async function copyText(text){
    if(navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(text);return true}catch{}}
    const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();return ok;
  }
  function applyGptResults(){
    els.resultStatus.className="status";
    try{
      const obj=JSON.parse(els.resultJson.value);
      const checked=StudyCore.inspectGptResults(obj,gptSessions,registeredGptSessionIds,words.map(w=>w.id));
      if(checked.isReplay&&!confirm("学習結果を登録しますか？ この結果は過去に登録済みの可能性があります。重複して登録してもよろしいですか？")){
        els.resultStatus.textContent="登録をキャンセルしました。";return;
      }
      const draft=StudyCore.prepareGptImport(obj,gptSessions,words.map(w=>w.id),state,activeSession,undefined,registeredGptSessionIds,checked.isReplay);
      if(draft.activeSession)draft.activeSession.updatedAt=Date.now();
      StudyCore.saveCore(localStorage,STORAGE_LEDGER,{state:draft.state,activeSession:draft.activeSession,gptSessions:draft.gptSessions,registeredGptSessionIds:draft.registeredGptSessionIds});
      state=draft.state;activeSession=draft.activeSession;gptSessions=draft.gptSessions;registeredGptSessionIds=draft.registeredGptSessionIds;
      refreshVisibleRows();
      els.resultStatus.textContent=`${draft.applied}件を反映しました。`;els.resultStatus.className="status good";
    }catch(err){els.resultStatus.textContent=err.message||String(err);els.resultStatus.className="status bad"}
    finally{els.resultJson.value=""}
  }

  function restartViewSession(){finalizeSession();pageIndex=0;revealY=0;persistView();startSession(true);render()}
  function changeDisplaySettings(change){
    const before=pageModel();
    change();
    const model=pageModel(),plan=StudyCore.displayChangePlan(before,model,pageIndex);
    pageIndex=plan.pageIndex;persistPreferences();persistView();
    if(plan.targetChanged){
      finalizeSession();revealY=0;startSession(true);
    }else if(activeSession){
      activeSession.key=sessionKey();saveActiveSession(true);
    }
    render();
  }

  els.openSettings.addEventListener("click",()=>{if(!els.settingsPanel.open)els.settingsPanel.showModal()});
  els.closeSettings.addEventListener("click",()=>els.settingsPanel.close());
  els.openGpt.addEventListener("click",()=>{if(!els.gptPanel.open)els.gptPanel.showModal()});
  els.closeGpt.addEventListener("click",()=>els.gptPanel.close());
  document.querySelectorAll("[data-filter]").forEach(btn=>btn.addEventListener("click",()=>{
    const next=btn.dataset.filter;if(next===filter)return;filter=next;restartViewSession();
  }));
  els.excludeStreak.addEventListener("change",()=>{excludeStreak=els.excludeStreak.checked;restartViewSession()});
  els.pageSize.addEventListener("change",()=>{
    const next=Number(els.pageSize.value);if(!PAGE_SIZES.includes(next)||next===pageSize)return;
    changeDisplaySettings(()=>{pageSize=next});
  });
  els.masteryThreshold.addEventListener("change",()=>{
    const next=Number(els.masteryThreshold.value);if(!MASTERY_THRESHOLDS.includes(next)||next===masteryThreshold)return;
    changeDisplaySettings(()=>{masteryThreshold=next});
  });
  els.resetSettings.addEventListener("click",()=>{
    if(pageSize===50&&masteryThreshold===3)return;
    changeDisplaySettings(()=>{pageSize=50;masteryThreshold=3});
  });

  els.normalOrder.addEventListener("click",()=>{if(sortMode==="normal")return;sortMode="normal";restartViewSession()});
  els.randomOrder.addEventListener("click",()=>{ensureRandomOrder();if(sortMode==="random"){render();return}sortMode="random";restartViewSession()});
  els.reshuffle.addEventListener("click",()=>{
    finalizeSession();randomIds=shuffledIds();localStorage.setItem(STORAGE_RANDOM_ORDER,JSON.stringify(randomIds));sortMode="random";pageIndex=0;revealY=0;persistView();startSession(true);render();
  });

  els.csvFile.addEventListener("change",async e=>{const file=e.target.files?.[0];if(!file)return;try{importCsv(await file.text())}catch(err){alert(err.message||String(err))}e.target.value=""});
  els.resetCurtain.addEventListener("click",resetCurtain);
  els.repeatStudy.addEventListener("click",repeatStudy);
  els.clearData.addEventListener("click",()=>{
    if(!confirm("単語データと学習履歴をこの端末から削除しますか？"))return;
    words=[];state={};gptSessions={};registeredGptSessionIds=[];randomIds=[];activeSession=null;filter="all";sortMode="normal";excludeStreak=false;pageSize=50;masteryThreshold=3;pageIndex=0;revealY=0;
    for(const key of [STORAGE_WORDS,STORAGE_STATE,STORAGE_GPT_SESSIONS,STORAGE_ACTIVE_SESSION,STORAGE_LEDGER,STORAGE_RANDOM_ORDER,STORAGE_VIEW,STORAGE_PREFERENCES])localStorage.removeItem(key);
    startSession(true);render();
  });
  els.makeSession.addEventListener("click",makeGptSession);
  els.copySession.addEventListener("click",async()=>{if(!lastSessionUrl)return;const ok=await copyText(lastSessionUrl);els.copySession.textContent=ok?"コピー済み":"コピー失敗";setTimeout(()=>els.copySession.textContent="URLをコピー",1200)});
  els.applyResults.addEventListener("click",applyGptResults);

  validateRandomOrder();persistView();attachCurtainDrag();
  window.addEventListener("resize",positionCurtain);window.addEventListener("beforeunload",()=>{saveActiveSession();persistView()});
  startSession(false);render();requestAnimationFrame(()=>{revealY=Number(activeSession?.revealY||0);positionCurtain()});
})();
</script>
</body>
</html>

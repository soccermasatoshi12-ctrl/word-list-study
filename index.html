<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Word List Study</title>
  <style>
    :root{
      --bg:#f6f7f9;--panel:#fff;--text:#1f2328;--muted:#6b7280;
      --border:#d9dde3;--accent:#2563eb;--cover:#dfe3e8;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .app{max-width:820px;margin:0 auto;padding:12px}
    .app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
    .app-title{margin:0;font-size:1.1rem;line-height:1.2}
    .header-actions{display:flex;gap:6px}
    .icon-button{display:grid;place-items:center;width:42px;height:42px;min-height:42px;padding:8px;border:0;border-radius:50%;background:transparent}
    .icon-button:hover{background:#eef1f5}.icon-button:active{background:#e2e7ee}
    .icon-button:focus-visible,.modal-close:focus-visible{outline:3px solid #2563eb66;outline-offset:2px}
    .icon-button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .panel,.study-shell{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    button,label.file-btn,input,select{font:inherit;color:var(--text)}
    button,.file-btn,select{min-height:38px;border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 11px;cursor:pointer;color:var(--text);-webkit-text-fill-color:var(--text)}
    button.primary{background:var(--accent);color:#fff;-webkit-text-fill-color:#fff;border-color:var(--accent)}
    button:disabled{opacity:.5;cursor:default}
    .file-btn input{display:none}
    .study-controls button.active{border-color:var(--accent);background:#eff6ff;color:var(--accent);-webkit-text-fill-color:var(--accent);font-weight:600}
    .study-controls{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--border)}
    .filter-controls,.sort-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
    .study-controls button{min-height:36px;padding:6px 9px;font-size:.9rem}
    .count{margin-left:auto;color:var(--muted);font-size:.9rem}
    .page-navigation{padding:8px 0 4px}
    .hint{font-size:.84rem;color:var(--muted);line-height:1.45;margin-top:6px}
    .status{font-size:.9rem;margin-top:6px}.status.good{color:#18794e}.status.bad{color:#b42318}
    .mastery-switch{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:2px 4px;cursor:pointer;white-space:nowrap}
    .medal-icon{width:18px;height:20px;flex:0 0 auto;fill:none;stroke:#a67c24;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .mastery-switch input{appearance:none;-webkit-appearance:none;position:relative;width:44px;height:26px;margin:0;border:0;border-radius:999px;background:#b8bec8;cursor:pointer;transition:background-color .15s ease}
    .mastery-switch input::before{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .15s ease}
    .mastery-switch input:checked{background:var(--accent)}
    .mastery-switch input:checked::before{transform:translateX(18px)}
    .mastery-switch input:focus-visible{outline:3px solid #2563eb66;outline-offset:2px}
    .mastery-setting{display:inline-flex;align-items:center;gap:5px}
    .tabs{display:flex;gap:6px;overflow-x:auto;white-space:nowrap;padding:2px 0 8px;scrollbar-width:thin}
    .tabs button{flex:0 0 auto;min-height:36px;padding:5px 8px;font-size:.82rem}
    .tabs button.active{border-color:var(--accent);color:var(--accent);-webkit-text-fill-color:var(--accent);font-weight:600}
    .random-nav{min-width:0}
    .random-progress{min-width:0;overflow-wrap:anywhere;color:var(--muted);line-height:1.4}
    .study-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
    .study-actions button{min-width:0}
    .list-wrap{position:relative}.words{display:flex;flex-direction:column;gap:8px}
    .word-row{display:grid;grid-template-columns:minmax(0,210px) 48px minmax(0,1fr);gap:8px;align-items:stretch;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px}
    .word-cell{min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;align-content:center;column-gap:6px;row-gap:3px;padding:2px 4px}
    .word-main{grid-column:2;grid-row:1;align-self:baseline;min-width:0;font-weight:650;overflow-wrap:anywhere;word-break:break-word}
    .word-index{grid-column:1;grid-row:1;align-self:baseline;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
    .word-meta{grid-column:1 / -1;grid-row:2;min-width:0;display:flex;gap:6px;align-items:center;font-size:.75rem;color:var(--muted)}
    .word-meta .recent{letter-spacing:.08em;white-space:nowrap;font-variant-numeric:tabular-nums}
    .word-medal{width:15px;height:17px;margin-left:1px;vertical-align:middle}
    .check-cell{display:flex;align-items:center;justify-content:center}.check-cell input{width:23px;height:23px;accent-color:var(--accent)}
    .meaning-cell{position:relative;display:flex;align-items:center;min-height:48px;overflow:hidden;border-radius:8px;background:#fafafa;border:1px solid var(--border)}
    .meaning-text{position:relative;display:block;width:100%;padding:6px 10px;font-size:13px;line-height:1.35;overflow-wrap:anywhere;word-break:break-word}
    .empty-state{padding:18px;text-align:center;color:var(--muted)}
    [hidden]{display:none!important}
    dialog.modal{width:min(760px,calc(100vw - 24px));max-height:min(90dvh,900px);margin:auto;padding:0;border:0;border-radius:14px;background:transparent;color:var(--text);overflow:auto}
    dialog.modal::backdrop{background:rgba(15,23,42,.52)}
    dialog.modal>.panel{margin:0;border-radius:14px;overflow-wrap:anywhere}
    .modal-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .modal-close{display:grid;place-items:center;flex:0 0 42px;width:42px;height:42px;min-height:42px;padding:0;border-radius:50%;font-size:1.7rem;line-height:1}
    .settings-section{display:grid;gap:10px;padding:12px 0;border-top:1px solid var(--border)}
    .settings-section h2{margin:0;font-size:1rem}
    .settings-item{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
    .settings-item>label:first-child{min-width:0}
    .settings-item select{flex:0 0 auto}
    .settings-actions{display:flex;flex-wrap:wrap;gap:8px}
    dialog.modal input[type="text"]{max-width:100%;min-width:0;overflow-wrap:anywhere}
    .meaning-curtain{position:absolute;z-index:20;background:var(--cover);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);user-select:none;pointer-events:none}.meaning-curtain.hidden{display:none}
    .curtain-handle{position:absolute;z-index:21;height:34px;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;cursor:ns-resize;touch-action:none;user-select:none}.curtain-handle.hidden{display:none}
    .curtain-handle::before{content:"";width:58px;height:5px;border-radius:999px;background:#7d848d;box-shadow:0 0 0 6px rgba(223,227,232,.95)}
    textarea{width:100%;min-height:120px;border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;resize:vertical}#sessionUrl{width:100%;margin-top:8px}
    @media(max-width:560px){
      .app{padding:8px}
      .study-shell{padding:8px}
      .study-controls{display:flex;gap:6px 10px;padding-bottom:7px}
      .filter-controls,.sort-controls{gap:6px}
      .study-controls button{min-height:40px;padding:6px 9px}
      .mastery-switch{min-height:40px}
      .tabs button{min-height:40px;padding:6px 9px}
      .study-actions{justify-content:stretch;gap:6px;margin-top:8px;padding-top:8px}
      .study-actions button{flex:1 1 auto}
      .word-row{grid-template-columns:minmax(96px,1fr) 42px minmax(110px,1fr);gap:6px;padding:6px}
      .word-main{font-size:.98rem}.word-meta{font-size:.7rem;gap:5px}.meaning-text{padding:5px 8px}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1 class="app-title">Word List Study</h1>
    <div class="header-actions">
      <button id="openSettings" class="icon-button" type="button" aria-label="設定" title="設定">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="M10 3h4l.6 2.5c.7.2 1.3.6 1.8 1l2.5-.8 2 3.5-1.9 1.8a8 8 0 0 1 0 2l1.9 1.8-2 3.5-2.5-.8c-.5.4-1.1.8-1.8 1L14 21h-4l-.6-2.5c-.7-.2-1.3-.6-1.8-1l-2.5.8-2-3.5L5 13a8 8 0 0 1 0-2L3.1 9.2l2-3.5 2.5.8c.5-.4 1.1-.8 1.8-1z"/></svg>
      </button>
      <button id="openGpt" class="icon-button" type="button" aria-label="GPT学習" title="GPT学習">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5.5h16v11H11l-4.5 3v-3H4z"/><path d="m14.5 8 .6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z"/></svg>
      </button>
    </div>
  </header>

  <dialog id="settingsPanel" class="modal" aria-labelledby="settingsTitle">
  <div class="panel">
    <div class="modal-header"><strong id="settingsTitle">設定</strong><button id="closeSettings" class="modal-close" type="button" aria-label="設定を閉じる" title="閉じる">×</button></div>
    <section class="settings-section" aria-labelledby="learningSettingsTitle">
      <h2 id="learningSettingsTitle">学習設定</h2>
      <div class="settings-item"><label for="pageSize">1ページの表示語数</label>
        <select id="pageSize" aria-label="タブあたりの表示語数">
          <option value="10">10語</option><option value="20">20語</option><option value="50">50語</option><option value="100">100語</option>
        </select>
      </div>
      <div class="settings-item"><label class="mastery-setting" for="masteryThreshold"><svg class="medal-icon" aria-hidden="true" viewBox="0 0 20 24"><circle cx="10" cy="8" r="5.2"/><path d="M6.6 12 5 22l5-2.8 5 2.8-1.6-10"/><path d="m10 5.6.7 1.3 1.5.2-1.1 1.1.3 1.5-1.4-.7-1.4.7.3-1.5-1.1-1.1 1.5-.2z"/></svg>習得済み判定（連続正答）</label>
        <select id="masteryThreshold" aria-label="習得済み判定の連続正答回数">
          <option value="2">2回</option><option value="3">3回</option><option value="4">4回</option><option value="5">5回</option>
        </select>
      </div>
    </section>
    <section class="settings-section" aria-labelledby="csvSettingsTitle">
      <h2 id="csvSettingsTitle">CSV管理</h2>
      <label class="file-btn">CSV読込・差し替え<input id="csvFile" type="file" accept=".csv,text/csv"></label>
      <div class="hint">CSV形式: <code>id,word,meaning</code>（単語ID、英単語、日本語訳）。CSV読込・差し替えからファイルを選択します。同じidなら再読込しても学習履歴を引き継ぎます。</div>
      <div class="hint">通常順ではCSV登録順の固定範囲をタブに分け、ランダム順では保存済み順序の固定範囲に対して習得済み除外を適用します。</div>
    </section>
    <section class="settings-section" aria-labelledby="dataSettingsTitle">
      <h2 id="dataSettingsTitle">データ管理</h2>
      <div class="settings-actions"><button id="resetSettings" type="button">設定を初期値に戻す</button><button id="clearData" type="button">データ消去</button></div>
      <div class="hint">設定の初期化では学習履歴は消去されません。</div>
      <div class="hint">データ消去では、この端末の単語データと学習履歴を削除します。</div>
    </section>
  </div>
  </dialog>

  <main class="study-shell">
    <div class="study-controls" aria-label="学習対象と表示順">
      <div class="sort-controls" aria-label="表示順">
      <button id="normalOrder" class="active">通常順</button>
      <button id="randomOrder">ランダム</button>
      </div>
      <div class="filter-controls" aria-label="習得済み単語の表示">
        <label class="mastery-switch">
          <svg class="medal-icon" aria-hidden="true" viewBox="0 0 20 24"><circle cx="10" cy="8" r="5.2"/><path d="M6.6 12 5 22l5-2.8 5 2.8-1.6-10"/><path d="m10 5.6.7 1.3 1.5.2-1.1 1.1.3 1.5-1.4-.7-1.4.7.3-1.5-1.1-1.1 1.5-.2z"/></svg>
          <span>除外</span>
          <input id="excludeStreak" type="checkbox" role="switch" aria-label="習得済み単語を除外" aria-checked="false">
        </label>
      </div>
    </div>

    <section class="page-navigation" aria-label="ページナビゲーション">
      <div class="row"><span id="count" class="count">0語</span></div>
      <div id="tabs" class="tabs"></div>
      <div id="randomNav" class="random-nav" hidden>
        <div id="randomProgress" class="random-progress"></div>
      </div>
    </section>

    <div id="listWrap" class="list-wrap">
      <div id="words" class="words"></div>
      <div id="emptyState" class="empty-state" hidden>表示対象の単語がありません。</div>
      <div id="meaningCurtain" class="meaning-curtain hidden"></div>
      <div id="curtainHandle" class="curtain-handle hidden" aria-label="意味カバーを上下に動かす"></div>
    </div>
    <div class="study-actions" aria-label="学習操作">
      <button id="repeatStudy" disabled>もう一度学習</button>
      <button id="randomNext" class="primary" hidden>次へ</button>
      <button id="reshuffle" hidden>再シャッフル</button>
    </div>
  </main>

  <dialog id="gptPanel" class="modal" aria-labelledby="gptTitle">
    <div class="panel">
    <div class="modal-header"><strong id="gptTitle">GPT学習</strong><button id="closeGpt" class="modal-close" type="button" aria-label="GPT学習を閉じる" title="閉じる">×</button></div>
      <div class="row" style="margin-top:8px">
        <button id="makeSession" class="primary">このタブをGPT用URLにする</button>
        <button id="copySession" disabled>URLをコピー</button>
      </div>
      <input id="sessionUrl" type="text" readonly placeholder="ここにGPT用URLが出ます">
      <div class="hint">現在表示中の最大<span id="gptPageSize">10</span>語をGPT学習対象にします。</div>
      <div class="row" style="margin-top:12px"><strong>GPT学習結果を反映</strong><button id="applyResults">結果JSONを登録</button></div>
      <textarea id="resultJson" aria-label="GPT学習結果JSON" placeholder='{"version":1,"sessionId":"...","results":[{"id":"1","result":"correct"}]}'></textarea>
      <div id="resultStatus" class="status" role="status" aria-live="polite"></div>
    </div>
  </dialog>
</div>

<script src="study-core.js"></script>
<script>
(() => {
  const SESSION_TTL_MS=5*60*1000;
  const STORAGE_WORDS="wordlist.words.v2";
  const STORAGE_STATE="wordlist.state.v2";
  const STORAGE_GPT_SESSIONS="wordlist.gptSessions.v2";
  const STORAGE_ACTIVE_SESSION="wordlist.activeStudySession.v2";
  const STORAGE_RANDOM_ORDER="wordlist.randomOrder.v1";
  const STORAGE_VIEW="wordlist.view.v1";
  const STORAGE_PREFERENCES="wordlist.preferences.v1";
  const STORAGE_LEDGER="wordlist.studyLedger.v1";
  const savedCore=StudyCore.loadCore(localStorage,STORAGE_LEDGER,{stateKey:STORAGE_STATE,gptSessionsKey:STORAGE_GPT_SESSIONS,activeSessionKey:STORAGE_ACTIVE_SESSION});

  let words=loadJson(STORAGE_WORDS,[]);
  let state=savedCore.state;
  let gptSessions=savedCore.gptSessions;
  let registeredGptSessionIds=savedCore.registeredGptSessionIds||[];
  let randomIds=loadJson(STORAGE_RANDOM_ORDER,[]);
  const rawSavedView=loadJson(STORAGE_VIEW,{});
  const rawSavedPreferences=loadJson(STORAGE_PREFERENCES,{});
  const savedSessionView=savedCore.activeSession?.viewState;
  const canRecoverSavedSessionView=savedSessionView&& !StudyCore.sessionExpired(savedCore.activeSession,Date.now(),SESSION_TTL_MS);
  const savedView=canRecoverSavedSessionView?{...rawSavedView,...savedSessionView}:rawSavedView;
  const savedPreferences=canRecoverSavedSessionView&&savedSessionView.pageSize?{...rawSavedPreferences,pageSize:savedSessionView.pageSize,masteryThreshold:savedSessionView.masteryThreshold}:rawSavedPreferences;
  const PAGE_SIZES=[10,20,50,100], MASTERY_THRESHOLDS=[2,3,4,5];
  const initialPreferences=StudyCore.normalizePreferences(savedPreferences,savedView);
  let pageSize=initialPreferences.pageSize;

  const normalizedView=StudyCore.normalizeView(savedView,randomIds.length);
  // The removed hasMiss option remains accepted by the core for older callers,
  // but the app now always starts from the full registered word set.
  normalizedView.filter="all";
  let filter="all";
  let sortMode=normalizedView.sortMode;
  let excludeStreak=normalizedView.excludeStreak;
  let masteryThreshold=initialPreferences.masteryThreshold;
  let pageIndex=normalizedView.pageIndex;
  let randomStart=normalizedView.randomStart;
  let revealY=0, lastSessionUrl="", activeSession=savedCore.activeSession, curtainLayoutObserver=null;

  const els={
    openSettings:document.getElementById("openSettings"),closeSettings:document.getElementById("closeSettings"),settingsPanel:document.getElementById("settingsPanel"),openGpt:document.getElementById("openGpt"),closeGpt:document.getElementById("closeGpt"),gptPanel:document.getElementById("gptPanel"),repeatStudy:document.getElementById("repeatStudy"),
    csvFile:document.getElementById("csvFile"),clearData:document.getElementById("clearData"),
    pageSize:document.getElementById("pageSize"),masteryThreshold:document.getElementById("masteryThreshold"),resetSettings:document.getElementById("resetSettings"),
    count:document.getElementById("count"),tabs:document.getElementById("tabs"),listWrap:document.getElementById("listWrap"),words:document.getElementById("words"),
    emptyState:document.getElementById("emptyState"),gptPageSize:document.getElementById("gptPageSize"),
    randomNav:document.getElementById("randomNav"),randomProgress:document.getElementById("randomProgress"),randomNext:document.getElementById("randomNext"),
    meaningCurtain:document.getElementById("meaningCurtain"),curtainHandle:document.getElementById("curtainHandle"),
    excludeStreak:document.getElementById("excludeStreak"),
    normalOrder:document.getElementById("normalOrder"),randomOrder:document.getElementById("randomOrder"),reshuffle:document.getElementById("reshuffle"),
    makeSession:document.getElementById("makeSession"),copySession:document.getElementById("copySession"),sessionUrl:document.getElementById("sessionUrl"),
    resultJson:document.getElementById("resultJson"),applyResults:document.getElementById("applyResults"),resultStatus:document.getElementById("resultStatus")
  };

  function loadJson(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
  function persistCore(){
    localStorage.setItem(STORAGE_WORDS,JSON.stringify(words));
    writeCoreSnapshot();
  }
  function writeCoreSnapshot(){StudyCore.saveCore(localStorage,STORAGE_LEDGER,{state,activeSession,gptSessions,registeredGptSessionIds})}
  function currentView(){return{filter,sortMode,excludeStreak,excludeStreakN:masteryThreshold,masteryThreshold,pageIndex,randomStart}}
  function sessionView(view=currentView(),size=pageSize){return{...view,pageSize:size}}
  function persistView(view=currentView()){
    localStorage.setItem(STORAGE_VIEW,JSON.stringify(StudyCore.serializeView(view)));
  }
  function persistPreferences(size=pageSize,threshold=masteryThreshold){localStorage.setItem(STORAGE_PREFERENCES,JSON.stringify({pageSize:size,masteryThreshold:threshold}))}
  if(savedCore.gptSessionMigrationNeeded){try{writeCoreSnapshot()}catch{}}

  const defaultState=StudyCore.defaultState, normalizeState=StudyCore.normalizeState, appendResult=StudyCore.appendResult;
  function getState(id){if(!state[id])state[id]=defaultState();state[id]=normalizeState(state[id]);return state[id]}
  function recentFive(st){return StudyCore.formatRecentResults(st.recentResults,5)}
  function makeMedalIcon(){
    const ns="http://www.w3.org/2000/svg",svg=document.createElementNS(ns,"svg");
    svg.setAttribute("class","medal-icon word-medal");svg.setAttribute("viewBox","0 0 20 24");svg.setAttribute("role","img");svg.setAttribute("aria-label","習得済み");
    const circle=document.createElementNS(ns,"circle");circle.setAttribute("cx","10");circle.setAttribute("cy","8");circle.setAttribute("r","5.2");
    const ribbon=document.createElementNS(ns,"path");ribbon.setAttribute("d","M6.6 12 5 22l5-2.8 5 2.8-1.6-10");
    const star=document.createElementNS(ns,"path");star.setAttribute("d","m10 5.6.7 1.3 1.5.2-1.1 1.1.3 1.5-1.4-.7-1.4.7.3-1.5-1.1-1.1 1.5-.2z");
    svg.append(circle,ribbon,star);return svg;
  }
  function isMastered(st){return(st.currentStreak||0)>=masteryThreshold}

  function sameIdSet(orderIds,currentIds){
    if(!Array.isArray(orderIds)||orderIds.length!==currentIds.length)return false;
    const s=new Set(currentIds);
    return orderIds.every(id=>s.has(String(id)))&&new Set(orderIds.map(String)).size===currentIds.length;
  }
  function validateRandomOrder(){
    const ids=words.map(w=>String(w.id));
    if(!sameIdSet(randomIds,ids)){
      randomIds=[];
      randomStart=0;
      localStorage.removeItem(STORAGE_RANDOM_ORDER);
      if(sortMode==="random")sortMode="normal";
    }
  }
  function shuffledIds(){
    const a=words.map(w=>String(w.id));
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
    return a;
  }
  function ensureRandomOrder(){
    validateRandomOrder();
    if(!randomIds.length&&words.length){randomIds=shuffledIds();localStorage.setItem(STORAGE_RANDOM_ORDER,JSON.stringify(randomIds))}
  }

  function importCsv(text){
    const nextWords=StudyCore.parseWordCsv(text),oldIds=words.map(w=>String(w.id)),newIds=nextWords.map(w=>String(w.id));
    const idsChanged=!sameIdSet(oldIds,newIds),nextRandomIds=idsChanged?[]:randomIds;

  els.closeGpt.addEventListener("click",()=>els.gptPanel.close());
  els.excludeStreak.addEventListener("change",()=>{
    if(!restartViewSession({...currentView(),excludeStreak:els.excludeStreak.checked})){
      els.excludeStreak.checked=excludeStreak;els.excludeStreak.setAttribute("aria-checked",String(excludeStreak));
    }
  });
  els.pageSize.addEventListener("change",()=>{
    const next=Number(els.pageSize.value);if(!PAGE_SIZES.includes(next)||next===pageSize)return;
    changeDisplaySettings(next,masteryThreshold);
  });
  els.masteryThreshold.addEventListener("change",()=>{
    const next=Number(els.masteryThreshold.value);if(!MASTERY_THRESHOLDS.includes(next)||next===masteryThreshold)return;
    changeDisplaySettings(pageSize,next);
  });
  els.resetSettings.addEventListener("click",()=>{
    if(pageSize===10&&masteryThreshold===3)return;
    changeDisplaySettings(10,3);
  });

  els.normalOrder.addEventListener("click",()=>{if(sortMode==="normal")return;restartViewSession({...currentView(),sortMode:"normal",pageIndex:0})});
  els.randomOrder.addEventListener("click",()=>{
    if(sortMode==="random"){render();return}
    let order=randomIds,writeRandomOrder=false;
    if(!sameIdSet(order,words.map(word=>String(word.id)))){order=shuffledIds();writeRandomOrder=words.length>0}
    requestViewTransition({...currentView(),sortMode:"random"},{nextRandomIds:order,writeRandomOrder});
  });
  els.randomNext.addEventListener("click",nextRandomPage);
  els.reshuffle.addEventListener("click",reshuffleRandomOrder);

  els.csvFile.addEventListener("change",async e=>{const file=e.target.files?.[0];if(!file)return;try{importCsv(await file.text())}catch(err){alert(err.message||String(err))}e.target.value=""});
  els.repeatStudy.addEventListener("click",repeatStudy);
  els.clearData.addEventListener("click",()=>{
    if(!confirm("単語データと学習履歴をこの端末から削除しますか？"))return;
    words=[];state={};gptSessions={};registeredGptSessionIds=[];randomIds=[];activeSession=null;filter="all";sortMode="normal";excludeStreak=false;pageSize=10;masteryThreshold=3;pageIndex=0;randomStart=0;revealY=0;
    for(const key of [STORAGE_WORDS,STORAGE_STATE,STORAGE_GPT_SESSIONS,STORAGE_ACTIVE_SESSION,STORAGE_LEDGER,STORAGE_RANDOM_ORDER,STORAGE_VIEW,STORAGE_PREFERENCES])localStorage.removeItem(key);
    startSession(true);render();
  });
  els.makeSession.addEventListener("click",makeGptSession);
  els.copySession.addEventListener("click",async()=>{if(!lastSessionUrl)return;const ok=await copyText(lastSessionUrl);els.copySession.textContent=ok?"コピー済み":"コピー失敗";setTimeout(()=>els.copySession.textContent="URLをコピー",1200)});
  els.applyResults.addEventListener("click",applyGptResults);

  validateRandomOrder();persistView();attachCurtainDrag();
  window.addEventListener("beforeunload",()=>{saveActiveSession();persistView()});
  startSession(false);if(activeSession)revealY=0;render();requestAnimationFrame(()=>{const g=geometry();revealY=StudyCore.safeRevealBoundary(activeSession?.studiedIds,g?.thresholds,g?.height);positionCurtain()});
})();
</script>
</body>
</html>
